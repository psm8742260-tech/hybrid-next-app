name: Build and Deploy CWRB App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Production Bundle
        run: npm run build

      - name: Sync Files to cwrb.phrscrowd.online via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '65.108.76.42' }}
          username: ${{ secrets.FTP_USERNAME || 'phrscrow' }}
          password: ${{ secrets.PHRSCROW }}
          server-dir: /cwrb.phrscrowd.online/
          local-dir: ./dist/
          dangerous-clean-slate: false
