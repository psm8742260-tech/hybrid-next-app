name: Auto-Deploy to cPanel Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Auto Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: 📦 1. Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '*'
          cache: 'npm'

      - name: 📦 3. Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 4. Build Production Bundle
        run: |
          npm run build

      - name: 🚀 5. Sync to cPanel Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: '65.108.76.42'
          username: 'phrscrow'
          password: ${{ secrets.PHRSCROW }}
          local-dir: dist/
          server-dir: '/cwrb.phrscrowd.online/'
          dangerous-clean-slate: false
