<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWRB - Splash Mockup Zoomed</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#072459] h-screen w-screen flex flex-col items-center justify-center overflow-hidden">
    <!-- No background dots or photos as requested -->
    
    <div class="w-full flex flex-col items-center justify-center z-10 flex-1">
        <!-- New Logo Rounded -->
        <div class="relative w-full flex items-center justify-center mb-6 mt-4">
            <div class="rounded-full shadow-[0_0_40px_rgba(255,192,0,0.15)] overflow-hidden w-36 h-36 md:w-48 md:h-48 ring-2 ring-[#FFC000]/20 flex items-center justify-center bg-[#072459]">
                <!-- Added scale-125 for zooming -->
                <img src="/temp-logo.jpg" alt="CWRB New Logo" class="w-full h-full object-cover scale-150 object-center" />
            </div>
        </div>
        
        <!-- Text -->
        <div class="text-center px-4 w-full mt-4">
            <h1 class="text-[#FFC000] text-2xl md:text-3xl font-bold tracking-wide" style="text-shadow: 0 2px 4px rgba(0,0,0,0.3)">
                సివిల్ వర్కర్ కస్టమర్ రిలేషన్ బుక్
            </h1>
            <p class="text-[#8ba3c7] text-[11px] md:text-[13px] mt-4 font-medium tracking-[0.2em] uppercase">
                Civil Worker Customer Relation Book
            </p>
        </div>
    </div>
    
    <div class="w-full max-w-sm z-10 flex flex-col justify-center mb-10 text-center px-4">
       <!-- Mock Login -->
       <button class="w-full bg-[#FFC000] text-black font-bold py-3 rounded text-sm mb-4">OTP పంపండి (Get verification OTP)</button>
    </div>
</body>
</html>
