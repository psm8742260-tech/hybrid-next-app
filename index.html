<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#082c75" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Civil Worker Book" />
    <meta name="application-name" content="Civil Worker Book" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <title>Civil Worker Book</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      /* Reset and base rules */
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #013088;
      }

      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker registration (safeguarded)
      if ('serviceWorker' in navigator) {
        if (window.self === window.top) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js').then((reg) => {
              console.log('Service Worker registered successfully:', reg);
              if (reg && typeof reg.update === 'function') {
                reg.update().catch((err) => {
                  console.log('Service Worker update check skipped:', err);
                });
              }
            }).catch((err) => {
              console.log('Service Worker registration failed:', err);
            });
          });
          let refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!refreshing) {
              refreshing = true;
              console.log('New Service Worker version detected! Reloading page automatically...');
              window.location.reload();
            }
          });
        }
      }
    </script>
  </body>
</html>
